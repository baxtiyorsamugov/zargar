<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zavod haqida — SOFIZAR</title>
  <meta name="description" content="SOFIZAR zargarlik zavodi: eskizdan vitrinagacha, proba nazorati va qo'l mehnati.">
  <link rel="preload" href="assets/fonts/gilroy-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/gilroy-black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="about">
<!--BODY-->
<div id="chrome-top"></div>
<main data-page="about">
  <section class="wrap page-top">
    <div class="about-hero">
      <img src="assets/img/atelier.webp" alt="">
      <div class="about-hero-copy">
        <span class="hero-kicker light" data-i18n="abKicker">SOFIZAR Jewelry Factory</span>
        <h1 data-i18n="abTitle">Har bir uzuk ustaning qo'lidan o'tadi</h1>
        <p data-i18n="abLead"></p>
      </div>
    </div>
  </section>

  <section class="wrap section about-intro">
    <div class="about-text">
      <h2 data-i18n="abIntroTitle">Zavoddan vitrinagacha</h2>
      <p data-i18n="abIntro1"></p>
      <p data-i18n="abIntro2"></p>
    </div>
    <div class="about-stats">
      <div class="stat-card"><span><b data-i18n="abS1">yillik tajriba</b><small data-i18n="abS1s"></small></span><span class="stat-n">25+</span></div>
      <div class="stat-card"><span><b data-i18n="abS2">Proba</b><small data-i18n="abS2s"></small></span><span class="stat-n gold">585</span></div>
      <div class="stat-card"><span><b data-i18n="abS3">Kumush</b><small data-i18n="abS3s"></small></span><span class="stat-n">925</span></div>
      <div class="stat-card"><span><b data-i18n="abS4">Sertifikat</b><small data-i18n="abS4s"></small></span><span class="stat-n">100%</span></div>
    </div>
  </section>

  <section class="wrap section">
    <div class="section-head">
      <h2 data-i18n="abProcess">Buyum qanday tug'iladi</h2>
      <p class="section-note" data-i18n="abProcessNote"></p>
    </div>
    <ol class="process" id="process"></ol>
  </section>

  <section class="wrap section">
    <div class="quality">
      <div class="quality-img"><img src="assets/img/campaign-hands.webp" alt="" loading="lazy"></div>
      <div class="quality-copy">
        <h2 data-i18n="abQuality">Sifatga kafolat</h2>
        <ul class="check-list" id="qualityList"></ul>
        <a class="btn btn-light" data-href="warranty"><span data-i18n="warrantyMore">Kafolat shartlari</span><svg class="ico"><use href="#i-arrow"/></svg></a>
      </div>
    </div>
  </section>

  <section class="wrap section">
    <div class="cta-band">
      <div>
        <h2 data-i18n="abCta">Buyumlarni jonli ko'ring</h2>
        <p data-i18n="abCtaText"></p>
      </div>
      <div class="cta-actions">
        <a class="btn btn-band-solid" data-href="catalog"><span data-i18n="toCatalog">Katalogga o'tish</span><svg class="ico"><use href="#i-arrow"/></svg></a>
        <a class="btn btn-band" data-href="stores" data-i18n="ctaStore">Do'konni topish</a>
      </div>
    </div>
  </section>
</main>
<div id="chrome-bottom"></div>
<!--/BODY-->
<script src="assets/js/core.js"></script>
<script src="assets/js/pages.js"></script>
<script>SZ.start()</script>
</body>
</html>
