<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zavod haqida — SOFIZAR</title>
  <meta name="description" content="SOFIZAR zargarlik zavodi: eskizdan vitrinagacha, proba nazorati va qoʻl mehnati.">
  <link rel="icon" href="assets/img/sofizar/favicon.png" type="image/png">
  <link rel="preload" href="assets/fonts/ManropeVariable.woff2" as="font" type="font/woff2" crossorigin>
  <script src="assets/js/boot.js?v=fast-repeat"></script>
  <link rel="stylesheet" href="assets/css/main.css?v=borderless-cards">
</head>
<body data-page="about">
<!--BODY-->
<div id="chrome-top"></div>
<main data-page="about">
  <section class="wrap page-top">
    <div class="about-hero">
      <div class="factory-media" id="factoryPlayer" data-paused="true" tabindex="0" role="group">
        <video id="factoryVideo" poster="assets/img/sofizar/factory-poster.webp" muted playsinline loop preload="none" data-src="assets/video/sofizar-factory.mp4"></video>
        <span class="factory-status" id="factoryStatus" role="status" hidden></span>
        <div class="factory-controls">
          <div class="factory-seek-row">
            <input id="factorySeek" type="range" min="0" max="0" step="0.1" value="0" aria-controls="factoryVideo" disabled>
            <span class="factory-time" id="factoryTime" aria-hidden="true">0:00</span>
          </div>
          <div class="factory-control-row">
            <button type="button" class="factory-control factory-skip" id="factoryBack" aria-controls="factoryVideo" disabled>
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 1 1-1 6M4 4v5h5"/></svg>
              <span aria-hidden="true">10</span>
            </button>
            <button type="button" class="factory-control" id="factoryPlay" aria-controls="factoryVideo">
              <svg class="ico factory-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg>
              <svg class="ico factory-pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
            </button>
            <button type="button" class="factory-control factory-skip" id="factoryForward" aria-controls="factoryVideo" disabled>
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 9a8 8 0 1 0 1 6M20 4v5h-5"/></svg>
              <span aria-hidden="true">10</span>
            </button>
            <div class="factory-volume">
              <button type="button" class="factory-control" id="factoryMute" aria-controls="factoryVideo">
                <svg class="ico factory-sound-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4ZM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg>
                <svg class="ico factory-muted-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4ZM16 9l6 6m0-6-6 6"/></svg>
              </button>
              <input id="factoryVolume" type="range" min="0" max="1" step="0.05" value="0">
            </div>
            <button type="button" class="factory-control" id="factoryFullscreen" aria-controls="factoryVideo">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="about-hero-copy">
        <span class="hero-kicker" data-i18n="abKicker">SOFIZAR Jewelry Factory</span>
        <h1 data-i18n="abTitle">Har bir uzuk ustaning qoʻlidan oʻtadi</h1>
        <p data-i18n="abLead"></p>
      </div>
    </div>
  </section>

  <section class="wrap section about-intro">
    <div class="about-text">
      <h2 data-i18n="abIntroTitle">Zavoddan vitrinagacha</h2>
      <p data-i18n="abIntro1"></p>
      <p data-i18n="abIntro2"></p>
    </div>
    <div class="about-stats">
      <div class="stat-card"><span><b data-i18n="abS1">yillik tajriba</b><small data-i18n="abS1s"></small></span><span class="stat-n">25+</span></div>
      <div class="stat-card"><span><b data-i18n="abS2">Proba</b><small data-i18n="abS2s"></small></span><span class="stat-n gold">585</span></div>
      <div class="stat-card"><span><b data-i18n="abS3">Kumush</b><small data-i18n="abS3s"></small></span><span class="stat-n">925</span></div>
      <div class="stat-card"><span><b data-i18n="abS4">Sertifikat</b><small data-i18n="abS4s"></small></span><span class="stat-n">100%</span></div>
    </div>
  </section>

  <section class="wrap section">
    <div class="section-head">
      <h2 data-i18n="abProcess">Buyum qanday tugʻiladi</h2>
      <p class="section-note" data-i18n="abProcessNote"></p>
    </div>
    <ol class="process" id="process"></ol>
  </section>

  <section class="wrap section">
    <div class="quality">
      <div class="quality-img"><span class="media-slot"><img src="assets/img/campaign-hands.webp" alt="" loading="lazy"></span></div>
      <div class="quality-copy">
        <h2 data-i18n="abQuality">Sifatga kafolat</h2>
        <ul class="check-list" id="qualityList"></ul>
        <a class="btn btn-light" data-href="warranty"><span data-i18n="warrantyMore">Kafolat shartlari</span><svg class="ico"><use href="#i-arrow"/></svg></a>
      </div>
    </div>
  </section>

  <section class="wrap section">
    <div class="cta-band">
      <div>
        <h2 data-i18n="abCta">Buyumlarni jonli koʻring</h2>
        <p data-i18n="abCtaText"></p>
      </div>
      <div class="cta-actions">
        <a class="btn btn-band-solid" data-href="catalog"><span data-i18n="toCatalog">Katalogga oʻtish</span><svg class="ico"><use href="#i-arrow"/></svg></a>
        <a class="btn btn-band" data-href="stores" data-i18n="ctaStore">Doʻkonni topish</a>
      </div>
    </div>
  </section>
</main>
<dialog class="factory-dialog" id="factoryDialog"></dialog>
<div id="chrome-bottom"></div>
<!--/BODY-->
<script src="data/catalog.js"></script>
<script src="assets/js/core.js?v=fast-repeat"></script>
<script src="assets/js/pages.js?v=scroll-navigation"></script>
<script src="assets/js/factory-video.js?v=video-seek"></script>
<script>SZ.start()</script>
</body>
</html>
