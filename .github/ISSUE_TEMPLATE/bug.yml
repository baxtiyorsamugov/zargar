name: Баг
description: Что-то работает не так, как должно
title: "[Баг] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидалось
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактически
      description: Скриншоты, логи, текст ошибки.
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Окружение
      options: [local, staging, production]
  - type: dropdown
    id: severity
    attributes:
      label: Критичность
      options:
        - Блокер — не работает оплата / заказ / сайт
        - Высокая — ломает важный сценарий
        - Средняя
        - Низкая — косметика
